[build-system]
requires = ["setuptools>=77.0.3"]
build-backend = "setuptools.build_meta"

[project]
name = "slabnirt"
dynamic = ["version"]
description = "Processing and analysis tools for Normalized Impulse Response Testing of concrete slabs and other plate-like structures"
readme = "README.md"
authors = [{name = "Ilya Lozovsky", email = "i.n.lozovsky@gmail.com"}]
keywords = [
    "normalized impulse response testing",
    "non-destructive testing",
    "foundation slabs",
    "tunnel linings",
]
requires-python = ">=3.12"
license = "BSD-3-Clause"
license-files = ["LICENSE"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Science/Research",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.12",
    "Topic :: Scientific/Engineering",
]

# Packages the modules import directly, and openpyxl, which pandas needs to
# read .xlsx catalogs and write .xlsx exports but does not install. geopandas
# is optional: it is imported only to draw shapefile overlays.
dependencies = [
    "matplotlib>=3.8",
    "numpy>=1.26",
    "openpyxl>=3.1",
    "pandas>=2.1.1",
    "scipy>=1.11.2",
    "segyio>=1.9.12",
    "verde>=1.8.1",
]

[project.urls]
Homepage = "https://github.com/ilozovsky/SlabNIRT"
Repository = "https://github.com/ilozovsky/SlabNIRT"
Issues = "https://github.com/ilozovsky/SlabNIRT/issues"

[project.optional-dependencies]
shapefiles = ["geopandas>=1.0"]
test = ["pytest>=8", "slabnirt[shapefiles]"]
lint = ["ruff>=0.16"]
build = ["build>=1.2"]

[tool.setuptools]
package-dir = {"" = "src"}
include-package-data = false
packages = ["slabnirt"]

[tool.setuptools.dynamic]
version = {attr = "slabnirt.__version__"}

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I", "B", "UP"]

[tool.ruff.format]
docstring-code-format = true
